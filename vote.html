<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04070a">
<title>投我一票 · 交给我，你放100个percent心</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="rec-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="progress" aria-hidden="true"></div>
<div class="status" aria-hidden="true"><span class="dot"></span>REC <b id="tc">00:00:00:00</b></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="page wrap">
  <div class="page-top">
    <a href="index.html" class="back"><i>←</i> 返回首页</a>
    <span class="page-code">03 / Vote</span>
  </div>

  <div class="page-head">
    <span class="ghost" aria-hidden="true">03</span>
    <span class="kicker">Vote</span>
    <h1>投我一票</h1>
    <span class="sub-en">Your Support · Class Election 2026</span>
  </div>

  <section class="vote-box reveal">
    <span class="ring r1" aria-hidden="true"></span>
    <span class="ring r2" aria-hidden="true"></span>
    <div class="vote-label">当前票数 / Votes</div>
    <div class="vote-num" id="voteNum">5</div>
    <div class="vote-hint">Live Counting</div>

    <button class="btn-vote" id="voteBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>
      </svg>
      投票支持
    </button>

    <p class="vote-note">每一票都是信任，我会用行动兑现承诺。</p>
    <span class="vote-corner l" aria-hidden="true">Signal / Verified</span>
    <span class="vote-corner r" aria-hidden="true">Live · 2026</span>
  </section>

  <div class="page-back">
    <a href="index.html" class="back"><i>←</i> 返回首页</a>
  </div>
</main>

<footer class="foot wrap">
  <span class="brand-mark">GYH <b>·</b> 2026</span>
  <span>03 / 投我一票</span>
  <span>交给我 · 你放 100 个 percent 心</span>
</footer>

<div class="popup" id="popup" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="popTitle">
  <div class="popup-card">
    <div class="ic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2 id="popTitle">感谢你的支持！</h2>
    <p>你的一票对我很重要</p>
    <button type="button" id="closePop">好的</button>
  </div>
</div>

<script src="app.js"></script>
<script>
(function () {
  var num = 5;
  var dom = document.getElementById('voteNum');
  var btn = document.getElementById('voteBtn');
  var pop = document.getElementById('popup');

  function paint(bump) {
    dom.textContent = num;
    if (bump) {
      dom.classList.add('bump');
      setTimeout(function () { dom.classList.remove('bump'); }, 320);
    }
  }

  var live = setInterval(function () { num++; paint(true); }, 2400);

  /* 粒子 */
  var cvs = document.getElementById('fx');
  var ctx = cvs.getContext('2d');
  var parts = [];
  var running = false;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function sizeCanvas() {
    cvs.width = Math.floor(innerWidth * dpr);
    cvs.height = Math.floor(innerHeight * dpr);
    cvs.style.width = innerWidth + 'px';
    cvs.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  addEventListener('resize', sizeCanvas);

  var COLORS = ['#5fe9da', '#9ff5ec', '#3fb8c9', '#ffffff', '#d8f7f3'];

  function burst(x, y) {
    for (var i = 0; i < 70; i++) {
      var a = (Math.PI * 2 * i) / 70 + Math.random() * .3;
      var sp = 2.2 + Math.random() * 7.4;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.4,
        life: 1,
        decay: .012 + Math.random() * .016,
        r: 1 + Math.random() * 2.4,
        c: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vx *= .975;
      p.vy = p.vy * .975 + .11;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (parts.length) {
      requestAnimationFrame(tick);
    } else {
      running = false;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }

  btn.addEventListener('click', function () {
    var r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);

    num++;
    paint(true);
    clearInterval(live);

    pop.classList.add('show');
    pop.setAttribute('aria-hidden', 'false');
    btn.disabled = true;
    document.getElementById('closePop').focus();
  });

  function closePop() {
    pop.classList.remove('show');
    pop.setAttribute('aria-hidden', 'true');
    btn.focus();
  }

  document.getElementById('closePop').addEventListener('click', closePop);
  pop.addEventListener('click', function (e) { if (e.target === pop) closePop(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
})();
</script>
</body>
</html>
