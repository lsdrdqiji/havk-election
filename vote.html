<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ec">
<title>投我一票 · 交给我，你放100个percent心</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="style.css?v=paper1">
</head>
<body>

<div class="progress" aria-hidden="true"></div>

<main class="page wrap">
  <div class="page-top">
    <a href="index.html" class="back"><i>←</i> 返回首页</a>
    <span class="page-code">03 / Vote</span>
  </div>

  <div class="page-head">
    <span class="ghost" aria-hidden="true">03</span>
    <span class="kicker">Vote</span>
    <h1>投我一票</h1>
    <span class="sub-en">Your Support · Class Election 2026</span>
  </div>

  <section class="vote-box reveal">
    <div class="vote-label">当前票数 / Votes</div>
    <div class="vote-num" id="voteNum">5</div>
    <div class="vote-hint">Live Counting</div>

    <button class="btn-vote" id="voteBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>
      </svg>
      投票支持
    </button>

    <p class="vote-note">每一票都是信任，我会用行动兑现承诺。</p>

    <span class="seal" id="seal" aria-hidden="true">
      <b>已投</b>
      <i>Class 2026</i>
    </span>
  </section>

  <div class="page-back">
    <a href="index.html" class="back"><i>←</i> 返回首页</a>
  </div>
</main>

<footer class="foot wrap">
  <span class="brand-mark">GYH <b>·</b> 2026</span>
  <span>03 / 投我一票</span>
  <span>交给我 · 你放 100 个 percent 心</span>
</footer>

<div class="popup" id="popup" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="popTitle">
  <div class="popup-card">
    <div class="ic">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2 id="popTitle">感谢你的支持！</h2>
    <p>你的一票对我很重要</p>
    <button type="button" id="closePop">好的</button>
  </div>
</div>

<script src="app.js"></script>
<script>
(function () {
  var num = 5;
  var dom = document.getElementById('voteNum');
  var btn = document.getElementById('voteBtn');
  var pop = document.getElementById('popup');
  var seal = document.getElementById('seal');

  function paint(bump) {
    dom.textContent = num;
    if (bump) {
      dom.classList.remove('bump');
      void dom.offsetWidth;
      dom.classList.add('bump');
    }
  }

  var live = setInterval(function () { num++; paint(true); }, 2400);

  btn.addEventListener('click', function () {
    num++;
    paint(true);
    clearInterval(live);

    seal.classList.add('on');

    setTimeout(function () {
      pop.classList.add('show');
      pop.setAttribute('aria-hidden', 'false');
      document.getElementById('closePop').focus();
    }, 620);

    btn.disabled = true;
  });

  function closePop() {
    pop.classList.remove('show');
    pop.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('closePop').addEventListener('click', closePop);
  pop.addEventListener('click', function (e) { if (e.target === pop) closePop(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
})();
</script>
</body>
</html>
